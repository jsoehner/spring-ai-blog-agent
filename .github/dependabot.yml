version: 2
updates:
- package-ecosystem: gradle
  directory: /
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 1
  assignees:
  - jsoehner
  reviewers:
  - jsoehner
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 1
  assignees:
  - jsoehner
  reviewers:
  - jsoehner
