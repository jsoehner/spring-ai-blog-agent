name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Trusted OSS Cache (mTLS) if TRUSTED_OSS_CACHE_URL is set
        env:
          TRUSTED_OSS_CACHE_URL: ${{ vars.TRUSTED_OSS_CACHE_URL }}
          TRUSTED_OSS_MODE: ${{ vars.TRUSTED_OSS_MODE || 'virtual' }}
          OSS_MTLS_CLIENT_CERT: ${{ secrets.OSS_MTLS_CLIENT_CERT }}
          OSS_MTLS_CLIENT_KEY: ${{ secrets.OSS_MTLS_CLIENT_KEY }}
        run: |
          CACHE_URL="${TRUSTED_OSS_CACHE_URL%/}"
          if [[ -z "$CACHE_URL" ]]; then
            echo "[INFO] TRUSTED_OSS_CACHE_URL is unset; using public upstream OSS repositories."
            exit 0
          fi
          mkdir -p ~/.m2 ~/.oss-tls
          printf '%s\n' "$OSS_MTLS_CLIENT_CERT" > ~/.oss-tls/client.crt
          printf '%s\n' "$OSS_MTLS_CLIENT_KEY" > ~/.oss-tls/client.key
          chmod 0600 ~/.oss-tls/client.key
          curl -fsSL --cert ~/.oss-tls/client.crt --key ~/.oss-tls/client.key \
            "${CACHE_URL}/keys/trusted-oss-pubkey.asc" -o ~/.oss-tls/trusted-oss-pubkey.asc
          gpg --batch --import ~/.oss-tls/trusted-oss-pubkey.asc
          openssl pkcs12 -export -in ~/.oss-tls/client.crt -inkey ~/.oss-tls/client.key \
            -out ~/.oss-tls/client.p12 -passout pass:changeit
          echo "GRADLE_OPTS=-Djavax.net.ssl.keyStore=$HOME/.oss-tls/client.p12 -Djavax.net.ssl.keyStoreType=PKCS12 -Djavax.net.ssl.keyStorePassword=changeit" >> "$GITHUB_ENV"
          echo "PIP_INDEX_URL=${CACHE_URL}/pypi/${TRUSTED_OSS_MODE}/simple" >> "$GITHUB_ENV"
          echo "UV_INDEX_URL=${CACHE_URL}/pypi/${TRUSTED_OSS_MODE}/simple" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_USERNAME || github.repository_owner }}/spring-ai-agent
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
