plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'io.github.ben-manes.versions' version '0.67.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	def trustedOssUrl = System.getenv('TRUSTED_OSS_CACHE_URL')?.replaceAll('/+$', '')
	if (trustedOssUrl) {
		def trustedOssMode = System.getenv('TRUSTED_OSS_MODE') ?: 'virtual'
		maven { url = "${trustedOssUrl}/maven/${trustedOssMode}" }
	}
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
}

ext {
	set('springAiVersion', "2.0.2")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'com.rabbitmq:amqp-client:5.38.0'
	implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.29'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.23.0'
	implementation 'org.aspectj:aspectjweaver:1.9.27'
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama'
	implementation 'org.jsoup:jsoup:1.24.1'
	implementation 'com.drewnoakes:metadata-extractor:2.22.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus:1.18.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
