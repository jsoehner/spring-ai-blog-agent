# Custom data extension for Spring AI Blog Agent
# Models project-specific sources not covered by default CodeQL library

extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: sourceModel
    data:
      # RabbitMQ Message Queue Source - user input from message broker
      - ["com.example.demo", "BlogAgentController", True, "processSupervisorTask", "(String)", "", "Parameter[0]", "remote", "manual"]
      
      # HTTP Request Body Source - user input from API
      - ["com.example.demo", "ImageAgentController", True, "generateImageUrls", "(ImageAgentRequest)", "", "Parameter[0]", "remote", "manual"]
      
      # Deserialization Source - user-provided JSON payload
      - ["com.example.demo", "BlogAgentController", True, "processSupervisorTask", "(String)", "", "Parameter[0]", "remote", "manual"]
