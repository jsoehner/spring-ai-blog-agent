# Custom data extension for Spring AI Blog Agent
# Models project-specific sinks not covered by default CodeQL library

extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: sinkModel
    data:
      # HTTP Client - potential SSRF to internal services
      - ["org.springframework.web.client", "RestTemplate", True, "postForObject", "(String, Object, Class)", "Argument[0]", "ssrf", "manual"]
      
      # File System Access - path injection vulnerabilities
      - ["java.nio.file", "Files", True, "writeString", "(Path, CharSequence)", "Argument[0]", "path-injection", "manual"]
      - ["java.nio.file", "Files", True, "writeString", "(Path, CharSequence)", "Argument[0]", "path-injection", "manual"]
      
      # WordPress Integration - path injection in file creation
      - ["com.example.demo", "WordPressTool", True, "createDraftPost", "(DraftRequest)", "", "Argument[0]", "path-injection", "manual"]
      
      # Code Tools - file write operations
      - ["com.example.demo", "CodeTools", True, "write", "(Path, String)", "Argument[0]", "path-injection", "manual"]
      
      # Chat Output - potential XSS when rendered in browser
      - ["com.example.demo", "ChatController", True, "chat", "(String, String)", "", "ReturnValue", "xss", "manual"]
      - ["com.example.demo", "BlogAgentController", True, "processSupervisorTask", "(String)", "", "ReturnValue", "xss", "manual"]
