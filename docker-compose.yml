services:
  rabbitmq:
    image: ${DOCKER_REGISTRY_PREFIX:-}rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    read_only: true
    tmpfs:
      - /var/lib/rabbitmq
      - /var/log/rabbitmq
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  supervisor-agent:
    build: .
    image: ghcr.io/jsoehner/spring-ai-blog-agent:latest
    ports:
      - "8081:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SPRING_PROFILES_ACTIVE=supervisor
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RESEARCHER_URL=http://researcher-agent:8080/research
      - IMAGE_AGENT_URL=http://image-agent:8080/image
      - SPRING_AI_OLLAMA_BASE_URL=http://192.168.100.190:11434
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL=qwen3:9b
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - SPRING_AI_OPENAI_API_KEY=dummy
      - OPA_URL=http://opa:8181/v1/data/agent/main
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./config:/app/config:z
      - ./.git:/app/.git:z
      - ./request-activity.log:/app/request-activity.log:z
      - ./output:/app/output:z
    read_only: true
    tmpfs:
      - /tmp:exec
    security_opt:
      - no-new-privileges:true


  researcher-agent:
    build: .
    image: ghcr.io/jsoehner/spring-ai-blog-agent:latest
    environment:
      - SPRING_PROFILES_ACTIVE=researcher
      - SPRING_RABBITMQ_HOST=rabbitmq
      - IMAGE_AGENT_URL=http://image-agent:8080/image
      - SPRING_AI_OLLAMA_BASE_URL=http://192.168.100.190:11434
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL=gemma4:12b
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - SPRING_AI_OPENAI_API_KEY=dummy
      - OPA_URL=http://opa:8181/v1/data/agent/main
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./config:/app/config:z
      - ./request-activity.log:/app/request-activity.log:z
      - ./output:/app/output:z
    read_only: true
    tmpfs:
      - /tmp:exec
    security_opt:
      - no-new-privileges:true

  image-agent:
    build: .
    image: ghcr.io/jsoehner/spring-ai-blog-agent:latest
    environment:
      - SPRING_PROFILES_ACTIVE=image-agent
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_AI_OLLAMA_BASE_URL=http://192.168.100.190:11434
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - SPRING_AI_OPENAI_API_KEY=dummy
      - OPA_URL=http://opa:8181/v1/data/agent/main
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./config:/app/config:z
      - ./request-activity.log:/app/request-activity.log:z
      - ./output:/app/output:z
    read_only: true
    tmpfs:
      - /tmp:exec
    security_opt:
      - no-new-privileges:true

  opa:
    image: ${DOCKER_REGISTRY_PREFIX:-}openpolicyagent/opa:latest-debug
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=debug"
      - "--v0-compatible"
      - "/policies"
    volumes:
      - ./security-policies/opa-guardrails/data/config.json:/policies/config.json:z
      - ./security-policies/opa-guardrails/policies:/policies/policies:z
      - ./policy.rego:/policies/policy.rego:z
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  prometheus:
    profiles:
      - monitoring
    image: ${DOCKER_REGISTRY_PREFIX:-}prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/tmp/prometheus'
    read_only: true
    tmpfs:
      - /prometheus
      - /tmp
    security_opt:
      - no-new-privileges:true

# No volumes required since we use host-bind mounts.
